services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      # node server port
      - 3200:3200
      # node debug port
      - 9229:9229
      - 24678:24678
    env_file:
      - .env
    volumes:
      # bind project root during development for HMR
      - ./client:/usr/src/app/client
      - ./server:/usr/src/app/server
      - ./common:/usr/src/app/common
      - ./views:/usr/src/app/views
      - type: bind
        source: /srv/chill/media
        target: /opt/app/media
      - type: bind
        source: /srv/chill/data
        target: /opt/app/data
      # Proximal to /srv/chill/media rather than under /srv/chill/data —
      # doesn't need to be on separate physical storage locally, but keeping
      # it out of the app_data path mirrors the prod TRANSCODED_PATH split.
      # Mounted outside /opt/app/data rather than nested under it — see
      # ADR-0008.
      - type: bind
        source: /srv/chill/transcoded
        target: /opt/app/transcoded
    command: pnpm dev
    depends_on:
      - postgres
      - redis
      - elasticsearch

  postgres:
    image: postgres:16-alpine
    container_name: chill-database
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:7.0-alpine
    container_name: chill-cache
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--rename-command",
        "FLUSHDB",
        "",
        "--rename-command",
        "FLUSHALL",
        "",
        "--rename-command",
        "CONFIG",
        "",
      ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: chill-search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${SEARCH_ENGINE_PASSWORD}
      xpack.security.enabled: false
    volumes:
      - elastic_search:/usr/share/elasticsearch/data
    ports:
      - 9200:9200

volumes:
  postgres:
  redis:
  elastic_search:
