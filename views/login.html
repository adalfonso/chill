<!doctype html>
<html>
  <head>
    <title>Login</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link rel="manifest" href="/manifest.json" />

    <style>
      @font-face {
        font-family: "Main-Font";
        src: url("/fonts/Rubik-VariableFont_wght.ttf") format("truetype");
        font-weight: 300;
        font-style: normal;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Main-Font";
        src: url("/fonts/Rubik-VariableFont_wght.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        font-family: "Main-Font";
        box-sizing: border-box;
      }

      html {
        height: 100%;
        width: 100%;
      }

      body {
        height: 100%;
        width: 100%;
        background-color: rgba(44, 41, 41, 0.97);
        color: #eee;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        display: flex;
        justify-content: center;
        padding: 3rem;
        height: 100%;
        width: 100%;
      }

      .items {
        width: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin: 4rem 0;
      }

      .items > * {
        margin: 1rem 0;
      }

      .items h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem 0;
      }

      .items p {
        margin: 0 0 2rem 0;
        color: #aaa;
        font-weight: 300;
      }

      /* Matches this app's shared .ui-error treatment (client/App.scss) --
         this page has no build step and can't import that stylesheet, so
         the same colors are duplicated here by hand. */
      .login-error {
        padding: 0.6rem 0.9rem;
        margin: 0 0 1rem 0;
        border-radius: 0.4rem;
        background-color: rgba(220, 70, 70, 0.15);
        border: 1px solid rgba(220, 70, 70, 0.4);
        color: #ff8a8a;
        font-size: 0.9rem;
        font-weight: 400;
      }

      .login-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #aaa;
        border-radius: 0.25rem;
        background-color: #eee;
        padding: 0.75rem 1.25rem;
        width: 100%;
      }

      .login-link img {
        margin-right: 0.125rem;
        width: 1.5rem;
      }

      a {
        text-decoration: none;
        color: rgba(72, 69, 69, 0.97);
        font-size: 1.25rem;
      }

      @media screen and (min-width: 844px) {
        .items {
          max-width: 300px;
        }
      }

      .spinner {
        display: none;
        width: 2rem;
        height: 2rem;
        margin: 4rem auto;
        border: 3px solid #555;
        border-top-color: #eee;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="items">
        <h1>Login</h1>
        <p>Please sign in to continue</p>

        <p class="login-error" id="login-error" hidden>
          Something went wrong signing you in. Please try again.
        </p>

        <a href="/auth/google" id="google-login">
          <div class="login-link">
            <img src="https://static.cdnlogo.com/logos/g/35/google-icon.svg" />
          </div>
        </a>
      </div>

      <div class="spinner" id="spinner"></div>
    </div>

    <script>
      // /auth/login?failure=true is set by the server (a denied/failed
      // Google OAuth attempt, or a login-session creation failure) --
      // this page has no framework/build step, so read it with plain JS.
      if (new URLSearchParams(location.search).get("failure") === "true") {
        document.getElementById("login-error").hidden = false;
      }

      // In the native app, Google refuses to render its login form inside the
      // embedded WebView. Route it through a Custom Tab instead (real Chrome,
      // so Google allows it) and return here via deep link when it's done,
      // rather than letting Google force a jarring hand-off to the full
      // Chrome app on its own.
      (function () {
        var capacitor = window.Capacitor;
        if (!capacitor || !capacitor.isNativePlatform || !capacitor.isNativePlatform()) {
          return;
        }

        var link = document.getElementById("google-login");
        var items = document.querySelector(".items");
        var spinner = document.getElementById("spinner");

        // Swapped in the instant the deep link arrives, before the token
        // exchange even starts, so there's no stale flash of the login
        // screen while that request is in flight.
        var showSpinner = function () {
          items.style.display = "none";
          spinner.style.display = "block";
        };

        var showLogin = function () {
          items.style.display = "flex";
          spinner.style.display = "none";
        };

        link.addEventListener("click", function (event) {
          event.preventDefault();
          capacitor.Plugins.Browser.open({
            url: window.location.origin + "/auth/google?platform=native",
          });
        });

        capacitor.Plugins.App.addListener("appUrlOpen", function (data) {
          var url = data.url || "";
          var marker_index = url.indexOf("auth/callback");
          if (marker_index === -1) {
            return;
          }

          capacitor.Plugins.Browser.close();
          showSpinner();

          // The Custom Tab's cookie jar is separate from this WebView, so the
          // cookies set at the end of the web OAuth flow never reach us here.
          // The deep link carries the signed access token and the opaque
          // refresh token instead; redeem them through a request that
          // actually originates from this WebView so the resulting
          // Set-Cookie lands in the right cookie jar.
          var params = new URLSearchParams(url.slice(marker_index).split("?")[1] || "");
          var access_token = params.get("access_token");
          var refresh_token = params.get("refresh_token");

          if (!access_token || !refresh_token) {
            showLogin();
            return;
          }

          fetch("/auth/native/exchange", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              access_token: access_token,
              refresh_token: refresh_token,
            }),
          })
            .then(function (response) {
              if (response.ok) {
                window.location.href = "/";
                return;
              }
              showLogin();
            })
            .catch(showLogin);
        });
      })();
    </script>
  </body>
</html>
