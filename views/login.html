<!doctype html>
<html>
  <head>
    <title>Login</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link rel="manifest" href="/manifest.json" />

    <style>
      @font-face {
        font-family: "Main-Font";
        src: url("/fonts/Rubik-VariableFont_wght.ttf") format("truetype");
        font-weight: 300;
        font-style: normal;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Main-Font";
        src: url("/fonts/Rubik-VariableFont_wght.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        font-family: "Main-Font";
        box-sizing: border-box;
      }

      html {
        height: 100%;
        width: 100%;
      }

      body {
        height: 100%;
        width: 100%;
        background-color: rgba(44, 41, 41, 0.97);
        color: #eee;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        display: flex;
        justify-content: center;
        padding: 3rem;
        height: 100%;
        width: 100%;
      }

      .items {
        width: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin: 4rem 0;
      }

      .items > * {
        margin: 1rem 0;
      }

      .items h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem 0;
      }

      .items p {
        margin: 0 0 2rem 0;
        color: #aaa;
        font-weight: 300;
      }

      /* Matches this app's shared .ui-error treatment (client/App.scss) --
         this page has no build step and can't import that stylesheet, so
         the same colors are duplicated here by hand. */
      .login-error {
        padding: 0.6rem 0.9rem;
        margin: 0 0 1rem 0;
        border-radius: 0.4rem;
        background-color: rgba(220, 70, 70, 0.15);
        border: 1px solid rgba(220, 70, 70, 0.4);
        color: #ff8a8a;
        font-size: 0.9rem;
        font-weight: 400;
      }

      .login-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #aaa;
        border-radius: 0.25rem;
        background-color: #eee;
        /* Fixed height so the button never resizes as its contents render. */
        height: 3rem;
        padding: 0 1.25rem;
        width: 100%;
      }

      .login-link svg {
        display: block;
        width: 1.5rem;
        height: 1.5rem;
      }

      a {
        text-decoration: none;
        color: rgba(72, 69, 69, 0.97);
        font-size: 1.25rem;
      }

      @media screen and (min-width: 844px) {
        .items {
          max-width: 300px;
        }
      }

      .spinner {
        display: none;
        width: 2rem;
        height: 2rem;
        margin: 4rem auto;
        border: 3px solid #555;
        border-top-color: #eee;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="items">
        <h1>Login</h1>
        <p>Please sign in to continue</p>

        <p class="login-error" id="login-error" hidden>
          Something went wrong signing you in. Please try again.
        </p>

        <a href="/auth/google" id="google-login" aria-label="Sign in with Google">
          <div class="login-link">
            <!-- Inlined so the icon renders with the page instead of waiting
                 on a separate (third-party) image request. -->
            <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
          </div>
        </a>
      </div>

      <div class="spinner" id="spinner"></div>
    </div>

    <script src="/auth/login.js" defer></script>
  </body>
</html>
