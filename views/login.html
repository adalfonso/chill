<!doctype html>
<html>
  <head>
    <title>Login</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link rel="manifest" href="/manifest.json" />

    <style>
      @font-face {
        font-family: "Main-Font";
        src: url("/fonts/Rubik-VariableFont_wght.ttf") format("truetype");
        font-weight: 300;
        font-style: normal;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Main-Font";
        src: url("/fonts/Rubik-VariableFont_wght.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        font-family: "Main-Font";
        box-sizing: border-box;
      }

      html {
        height: 100%;
        width: 100%;
      }

      body {
        height: 100%;
        width: 100%;
        background-color: rgba(44, 41, 41, 0.97);
        color: #eee;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        display: flex;
        justify-content: center;
        padding: 3rem;
        height: 100%;
        width: 100%;
      }

      .items {
        width: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin: 4rem 0;
      }

      .items > * {
        margin: 1rem 0;
      }

      .items h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem 0;
      }

      .items p {
        margin: 0 0 2rem 0;
        color: #aaa;
        font-weight: 300;
      }

      /* Matches this app's shared .ui-error treatment (client/App.scss) --
         this page has no build step and can't import that stylesheet, so
         the same colors are duplicated here by hand. */
      .login-error {
        padding: 0.6rem 0.9rem;
        margin: 0 0 1rem 0;
        border-radius: 0.4rem;
        background-color: rgba(220, 70, 70, 0.15);
        border: 1px solid rgba(220, 70, 70, 0.4);
        color: #ff8a8a;
        font-size: 0.9rem;
        font-weight: 400;
      }

      .login-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #aaa;
        border-radius: 0.25rem;
        background-color: #eee;
        padding: 0.75rem 1.25rem;
        width: 100%;
      }

      .login-link img {
        margin-right: 0.125rem;
        width: 1.5rem;
      }

      a {
        text-decoration: none;
        color: rgba(72, 69, 69, 0.97);
        font-size: 1.25rem;
      }

      @media screen and (min-width: 844px) {
        .items {
          max-width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="items">
        <h1>Login</h1>
        <p>Please sign in to continue</p>

        <p class="login-error" id="login-error" hidden>
          Something went wrong signing you in. Please try again.
        </p>

        <a href="/auth/google">
          <div class="login-link">
            <img src="https://static.cdnlogo.com/logos/g/35/google-icon.svg" />
          </div>
        </a>
      </div>
    </div>

    <script>
      // /auth/login?failure=true is set by the server (a denied/failed
      // Google OAuth attempt, or a login-session creation failure) --
      // this page has no framework/build step, so read it with plain JS.
      if (new URLSearchParams(location.search).get("failure") === "true") {
        document.getElementById("login-error").hidden = false;
      }
    </script>
  </body>
</html>
